  difc:
    en: [difc, dubai international financial centre, dubai international financial center, difc courts, dews, qualifying scheme]
    ar: [مركز دبي المالي العالمي, محاكم مركز دبي المالي العالمي]
    arabizi: []
  non_compete:
    en: [non-compete, non compete, restrictive covenant]
    ar: [عدم المنافسة, شرط عدم المنافسة]
